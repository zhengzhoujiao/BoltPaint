server {
    listen 80;
    server_name _;
    root /srv;
    client_max_body_size 20m;
    gzip on;
    gzip_static on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /boltPaint { return 301 /boltPaint/; }
    location = /bpManage { return 301 /bpManage/; }

    location ^~ /boltPaint/api/ {
        proxy_pass http://boltpaint_api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location ~ ^/boltPaint/(static|generated|custom)/ {
        rewrite ^/boltPaint/(.*)$ /$1 break;
        proxy_pass http://boltpaint_api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location ~ ^/(boltPaint|bpManage)/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /boltPaint/index.html {
        add_header Cache-Control "no-store";
    }
    location = /bpManage/index.html {
        add_header Cache-Control "no-store";
    }
    location /boltPaint/ {
        try_files $uri $uri/ /boltPaint/index.html;
    }
    location /bpManage/ {
        try_files $uri $uri/ /bpManage/index.html;
    }
    location / { return 404; }
}
