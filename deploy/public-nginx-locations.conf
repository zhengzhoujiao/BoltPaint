# Insert inside the existing bolt-series.cn HTTPS server block.
location = /boltPaint { return 301 /boltPaint/; }
location = /bpManage { return 301 /bpManage/; }

location ^~ /boltPaint/ {
    proxy_pass http://boltpaint_gateway:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_buffering off;
}
location ^~ /bpManage/ {
    proxy_pass http://boltpaint_gateway:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}
