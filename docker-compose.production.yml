services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?required}
    volumes:
      - ./data/db:/data/db
    networks:
      - database
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    restart: unless-stopped
    env_file: ./backend/.env.production
    volumes:
      - ./data/media:/data/media
    depends_on:
      - mongodb
    command: >-
      sh -c "python database/wait_for_mongo.py &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    networks:
      database:
      application:
        aliases:
          - boltpaint_api
  gateway:
    image: nginx:alpine
    container_name: boltpaint_gateway
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webApp/dist:/srv/boltPaint:ro
      - ./manage/dist:/srv/bpManage:ro
    depends_on:
      - backend
    networks:
      - application
      - bolt_net
networks:
  database:
    internal: true
  application:
  bolt_net:
    external: true
