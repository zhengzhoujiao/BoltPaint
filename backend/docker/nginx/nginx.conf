# ==============================================================================
# ⚠️  此文件为 BoltPaint 子项目独立部署时的 standalone nginx 参考配置
#
# 生产环境（主从架构）请使用：
#   OOWebsite/nginx/nginx.conf   ← 主站统一 nginx，处理所有子路径流量
#   OOWebsite/docker-compose.yml ← 主站编排，包含本服务及主站 nginx
#
# 此配置仅在需要单独运行 BoltPaint（不启动主站）时使用，
# 使用时需在 BoltPaint/docker-compose.yml 中恢复 nginx 服务定义。
# ==============================================================================

worker_processes 1;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    # Gzip 压缩配置
    gzip_static on; # 开启静态 gzip 分发，优先发送 .gz 文件
    gzip on; # 开启动态 gzip 压缩
    gzip_comp_level 6; # 压缩级别 1-9，6 是性能和压缩率较好的折中
    gzip_min_length 1k; # 最小压缩体积，小于 1k 不压缩
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml; # 需要压缩的文件类型
    gzip_vary on; # 在响应头中添加 Vary: Accept-Encoding

    upstream backend_server {
        server backend:8000;
    }

    # ==========================================================
    # --- 1. 用户端 WebApp (80 端口 -> 强制重定向到 443) ---
    # ==========================================================
    server {
        listen 80;
        # 将 localhost 替换为你的真实域名
        server_name bolt-series.com www.bolt-series.com; 

        # 核心：将所有 80 端口的 HTTP 请求，301 永久重定向到 HTTPS
        return 301 https://$host$request_uri;
    }

    # ==========================================================
    # --- 2. 用户端 WebApp (443 端口 / HTTPS 核心业务块) ---
    # ==========================================================
    server {
        listen 443 ssl;
        server_name bolt-series.com www.bolt-series.com;

        # 证书配置 (对应 docker-compose 中 - ./cert:/etc/nginx/cert:ro 挂载的路径)
        ssl_certificate     /etc/nginx/cert/bolt-series.com_bundle.pem;
        ssl_certificate_key /etc/nginx/cert/bolt-series.com.key;

        # 推荐的 SSL 安全协议配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 前端静态文件
        root /var/www/webapp;
        index index.html;

        # 官网占位，目前尚未开发，直接返回 404
        location = / {
            return 404;
        }

        # 暴露 robots.txt 以供搜索引擎爬取
        location = /robots.txt {
            alias /var/www/webapp/robots.txt;
        }

        # 针对 index.html 设置不缓存
        location = /boltPaint/index.html {
            alias /var/www/webapp/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        # WebApp 核心挂载点
        location ^~ /boltPaint {
            alias /var/www/webapp/;
            index index.html;
            try_files $uri $uri/ /boltPaint/index.html;
        }

        # API 代理
        location /api/ {
            # 重写 /api/foo -> /foo 转发给后端
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 告诉后端这是 HTTPS 请求 (非常重要，防止后端生成 http:// 的绝对链接)
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户图片：与后端 OBJECT_STORAGE_DIR 一致（默认挂载 /lhcos-data）
        location /static/ {
            alias /lhcos-data/uploads/;
        }

        location /generated/ {
            alias /lhcos-data/generated/;
        }

        location /custom/ {
            alias /lhcos-data/custom/;
        }

        # 针对带 hash 的资源设置长缓存
        location /boltPaint/assets/ {
            alias /var/www/webapp/assets/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }

    # ==========================================================
    # --- 3. 管理端 Manage (81 端口 / 目前保持 HTTP) ---
    # ==========================================================
    server {
        listen 81;
        # 如果你通过域名+81端口访问，这里可以写域名；如果是IP访问，保持 _ 或 localhost 即可
        server_name bolt-series.com www.bolt-series.com localhost; 

        root /var/www/manage;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # API 代理 (管理端也需要 API)
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /static/ {
            alias /lhcos-data/uploads/;
        }

        location /generated/ {
            alias /lhcos-data/generated/;
        }

        location /custom/ {
            alias /lhcos-data/custom/;
        }
    }
}
