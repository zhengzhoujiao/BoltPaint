<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">BoltPaint — 全栈 AI 图像创作平台</title>
  <desc id="desc">纯矢量 Hero，展示从提示词输入、模型路由到作品发布的完整创作链路。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.58" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#102b58"/>
    </linearGradient>
    <radialGradient id="focus" cx="82%" cy="46%" r="56%">
      <stop offset="0" stop-color="#2369ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2369ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd51a"/>
      <stop offset="1" stop-color="#54d7ff"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#173a79"/>
    </linearGradient>
    <linearGradient id="abstract" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd51a"/>
      <stop offset="0.52" stop-color="#2d6bff"/>
      <stop offset="1" stop-color="#58ddff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#b8c7e6" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="landscape-clip">
      <rect x="0" y="0" width="132" height="152" rx="14"/>
    </clipPath>
    <clipPath id="ink-clip">
      <rect x="0" y="0" width="112" height="132" rx="13"/>
    </clipPath>
    <clipPath id="abstract-clip">
      <rect x="0" y="0" width="96" height="112" rx="12"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="30" fill="url(#focus)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="29.25" fill="none" stroke="#28436d" stroke-opacity="0.65" stroke-width="1.5"/>

  <g id="brand-mark" transform="translate(56 42)">
    <circle cx="28" cy="28" r="28" fill="#ffd51a"/>
    <path d="M34 7 16 31h13l-8 20 24-29H32z" fill="#ffffff" stroke="#1553b8" stroke-width="4" stroke-linejoin="round"/>
    <path d="m21 51 7-18 8 8-15 10z" fill="#ffffff" stroke="#1553b8" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g id="identity" transform="translate(126 45)">
    <text x="0" y="18" fill="#9fb4d8" font-size="15" font-weight="700" letter-spacing="2.4"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SELF-HOSTED · CREATION STACK</text>
    <text x="0" y="54" fill="#f8fbff" font-size="30" font-weight="780"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">BoltPaint</text>
  </g>

  <g id="title-block" transform="translate(56 158)">
    <text x="0" y="0" fill="#f8fbff" font-size="44" font-weight="780"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">AI 图像产品的完整链路</text>
    <text x="0" y="64" fill="#f8fbff" font-size="44" font-weight="780"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">从一个仓库开始。</text>
    <text x="0" y="120" fill="#a9bad7" font-size="20"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">从灵感输入、异步生成，到作品发布与运营管理</text>
  </g>

  <g id="stack" transform="translate(56 329)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="0" y="0" width="132" height="40" rx="20" fill="#101e37" stroke="#334a70"/>
    <circle cx="20" cy="20" r="5" fill="#ffd51a"/>
    <text x="34" y="26" fill="#f8fbff" font-size="16" font-weight="700">WEB APP</text>
    <rect x="144" y="0" width="126" height="40" rx="20" fill="#101e37" stroke="#334a70"/>
    <circle cx="164" cy="20" r="5" fill="#54d7ff"/>
    <text x="178" y="26" fill="#f8fbff" font-size="16" font-weight="700">FASTAPI</text>
    <rect x="282" y="0" width="166" height="40" rx="20" fill="#101e37" stroke="#334a70"/>
    <circle cx="302" cy="20" r="5" fill="#6f8dff"/>
    <text x="316" y="26" fill="#f8fbff" font-size="16" font-weight="700">MODEL ROUTER</text>
  </g>

  <path d="M577 38V382" stroke="#ffd51a" stroke-opacity="0.34" stroke-width="1"/>
  <circle cx="577" cy="38" r="3" fill="#ffd51a"/>
  <circle cx="577" cy="382" r="3" fill="#54d7ff"/>

  <g id="pipeline-board" transform="translate(617 42)">
    <rect x="0" y="0" width="527" height="336" rx="24" fill="#0b172a" stroke="#2b4772" stroke-width="1.5"/>
    <text x="26" y="35" fill="#9fb4d8" font-size="15" font-weight="700" letter-spacing="2"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CREATION PIPELINE</text>
    <circle cx="470" cy="29" r="4" fill="#ffd51a"/>
    <circle cx="488" cy="29" r="4" fill="#54d7ff"/>

    <g id="prompt-card" transform="translate(26 64)">
      <rect width="132" height="196" rx="16" fill="#101f38" stroke="#35517c"/>
      <circle cx="24" cy="25" r="10" fill="#ffd51a"/>
      <text x="43" y="31" fill="#f8fbff" font-size="18" font-weight="750"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PROMPT</text>
      <rect x="18" y="55" width="96" height="10" rx="5" fill="#54709b"/>
      <rect x="18" y="76" width="75" height="10" rx="5" fill="#3c557d"/>
      <rect x="18" y="97" width="86" height="10" rx="5" fill="#3c557d"/>
      <rect x="18" y="128" width="42" height="30" rx="10" fill="#172d4f" stroke="#446694"/>
      <text x="29" y="148" fill="#dce8fb" font-size="14" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1:1</text>
      <rect x="70" y="128" width="44" height="30" rx="10" fill="#172d4f" stroke="#446694"/>
      <text x="80" y="148" fill="#dce8fb" font-size="14" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">HD</text>
      <path d="M20 177H112" stroke="#ffd51a" stroke-width="3" stroke-linecap="round"/>
    </g>

    <path d="M171 162H213" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>
    <path d="m206 155 9 7-9 7" fill="none" stroke="#54d7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="model-router" transform="translate(219 106)">
      <circle cx="59" cy="59" r="58" fill="#122748" stroke="#39639c" stroke-width="2"/>
      <circle cx="59" cy="59" r="42" fill="#ffd51a"/>
      <path d="M67 28 42 61h18L49 90l34-41H64z" fill="#ffffff" stroke="#1553b8" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="59" cy="59" r="51" fill="none" stroke="#54d7ff" stroke-width="2" stroke-dasharray="7 9"/>
      <text x="59" y="139" text-anchor="middle" fill="#9fb4d8" font-size="15" font-weight="700" letter-spacing="1.4"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">MODEL ROUTER</text>
    </g>

    <path d="M347 162H381" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>
    <path d="m374 155 9 7-9 7" fill="none" stroke="#54d7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="output-gallery" transform="translate(375 64)">
      <g transform="translate(40 8) rotate(7 48 56)">
        <rect x="4" y="6" width="96" height="112" rx="12" fill="#050a14" opacity="0.42"/>
        <g clip-path="url(#abstract-clip)">
          <rect width="96" height="112" rx="12" fill="#f6f8ff"/>
          <circle cx="70" cy="30" r="34" fill="url(#abstract)"/>
          <path d="M-8 92C17 48 38 120 64 75s44-23 50 14v32H-8z" fill="#2459d5"/>
          <circle cx="26" cy="32" r="13" fill="#ffd51a"/>
        </g>
        <rect width="96" height="112" rx="12" fill="none" stroke="#9ab4df"/>
      </g>

      <g transform="translate(8 34) rotate(-6 56 66)">
        <rect x="5" y="7" width="112" height="132" rx="13" fill="#050a14" opacity="0.45"/>
        <g clip-path="url(#ink-clip)">
          <rect width="112" height="132" rx="13" fill="#f3efe4"/>
          <circle cx="88" cy="26" r="11" fill="#ffd51a"/>
          <path d="M-5 115 25 67 43 94 67 48 119 117z" fill="#223653"/>
          <path d="M8 119 40 82 53 101 76 66 117 119z" fill="#4c6a91" opacity="0.72"/>
          <path d="M10 118C38 104 56 121 105 95" fill="none" stroke="#2369ff" stroke-width="4"/>
        </g>
        <rect width="112" height="132" rx="13" fill="none" stroke="#b8c3d4"/>
      </g>

      <g transform="translate(48 76)">
        <rect x="6" y="8" width="132" height="152" rx="14" fill="#050a14" opacity="0.48"/>
        <g clip-path="url(#landscape-clip)">
          <rect width="132" height="152" rx="14" fill="url(#sky)"/>
          <circle cx="100" cy="33" r="18" fill="#ffd51a"/>
          <path d="M-5 125 30 67 52 99 76 49 139 129z" fill="#10254b"/>
          <path d="M-8 145 30 105 53 128 82 91 143 146z" fill="#1d4f9b"/>
          <path d="M0 133C32 120 50 153 82 124s42-8 58 5v27H0z" fill="#54d7ff" opacity="0.78"/>
          <path d="M-5 141C30 126 47 157 79 132s43-10 61-2" fill="none" stroke="#f8fbff" stroke-opacity="0.75" stroke-width="3"/>
        </g>
        <rect width="132" height="152" rx="14" fill="none" stroke="#8ab6ff" stroke-width="1.5"/>
      </g>
    </g>

    <g transform="translate(26 290)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <circle cx="5" cy="5" r="5" fill="#ffd51a"/>
      <text x="18" y="11" fill="#9fb4d8" font-size="15" font-weight="700">INPUT</text>
      <path d="M76 5H140" stroke="#304b73"/>
      <circle cx="147" cy="5" r="5" fill="#6f8dff"/>
      <text x="160" y="11" fill="#9fb4d8" font-size="15" font-weight="700">GENERATE</text>
      <path d="M253 5H326" stroke="#304b73"/>
      <circle cx="333" cy="5" r="5" fill="#54d7ff"/>
      <text x="346" y="11" fill="#9fb4d8" font-size="15" font-weight="700">PUBLISH</text>
    </g>
  </g>
</svg>
